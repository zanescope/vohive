name: Update vowifi-go Dependency

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      vowifi_ref:
        description: vowifi-go ref, branch, tag, commit, or version.
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-vowifi-go
  cancel-in-progress: false

jobs:
  update:
    name: Update vowifi-go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOWIFI_VERSION: ${{ github.event.inputs.vowifi_ref || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Update vowifi-go module
        run: ./scripts/update-vowifi-go.sh

      - name: Run local CI before opening PR
        run: make ci

      - name: Create update pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: automation/update-vowifi-go
          delete-branch: true
          commit-message: 'chore: update vowifi-go dependency'
          title: 'chore: update vowifi-go dependency'
          body: |
            Automated update for `github.com/zanescope/vowifi-go`.

            This workflow runs `scripts/update-vowifi-go.sh` and `make ci`
            before opening or updating the pull request.
