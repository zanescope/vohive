name: vohive

services:
  vohive:
    image: "${VOHIVE_IMAGE:?Set VOHIVE_IMAGE to ghcr.io/zanescope/vohive@sha256:<digest>}"
    container_name: vohive
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: "${TZ:-UTC}"
      CONFIG_PATH: /app/config/config.yaml
    volumes:
      - "${VOHIVE_CONFIG_DIR:-./config}:/app/config"
      - "${VOHIVE_DATA_DIR:-./data}:/app/data"
      - "${VOHIVE_LOG_DIR:-./logs}:/app/logs"
      - /dev:/dev
    healthcheck:
      test: ["CMD", "/usr/local/bin/vohivectl", "probe", "--liveness", "--config", "/app/config/config.yaml"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
